name: Apex Space
description: >-
  Apex Space (Apex) is a Los Angeles based satellite manufacturing company that builds
  productized, configurable spacecraft bus platforms for proliferated constellations across
  LEO, MEO, and GEO orbital regimes. Apex offers three product lines: Aries (small satellites
  up to 150 kg payload), Nova (medium satellites up to 300 kg payload), and Comet (large
  satellites up to 3,000 kg payload), and operates Factory One, a high-rate manufacturing
  facility in Los Angeles with the capacity to produce more than 200 satellites annually.
  The company was surfaced as a portfolio company of a16z and added to the API Evangelist
  network. Apex does not currently publish a public API, developer portal, or developer
  documentation; customers configure satellite platforms through the on-site Configurator and
  direct sales inquiries.
